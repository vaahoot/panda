services:
  bot:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - LAVALINK_URL=lavalink:2333

    volumes:
      - ./bot.log:/app/bot.log
      - ./data:/app/data
      - ./src:/app/src/
      # Live like src/, so schema changes apply on restart instead of needing a rebuild
      - ./db:/app/db:ro

    depends_on:
      - lavalink

  # Fills the player database and keeps it fresh: re-checks every clan every 3 days and crawls
  # new players the rest of the time. Only starts when named: `docker compose up -d crawler`,
  # stop it with `docker compose stop crawler` (it saves the batch it's on before exiting)
  crawler:
    build: .
    profiles: ["crawler"]
    command: ["python3", "src/crawl_players.py", "--forever", "--refresh-days", "3"]
    restart: unless-stopped
    # In-flight requests can take up to 30s to finish before it saves and exits
    stop_grace_period: 1m

    env_file:
      - .env

    environment:
      - LOG_FILE=/app/data/crawler.log

    volumes:
      - ./data:/app/data
      - ./src:/app/src/
      - ./db:/app/db:ro

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    depends_on:
      - spotify-tokener
    environment:
      - _JAVA_OPTIONS=-Xmx1G
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - REFRESH_TOKEN=${REFRESH_TOKEN}
      - SPOTIFY_API_KEY=${SPOTIFY_API_KEY}
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
      # Plugin jars are kept in the repo, see application.yml
      - ./plugins:/opt/Lavalink/plugins:ro
    ports:
      - 127.0.0.1:2333:2333

  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    container_name: spotify-tokener
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
