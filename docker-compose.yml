services:
  bot:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - LAVALINK_URL=lavalink:2333

    volumes:
      - ./bot.log:/app/bot.log
      - ./data:/app/data
      - ./src:/app/src/

    depends_on:
      - flaresolverr
      - lavalink

  # Fills the player database. Only starts when named: `docker compose up -d crawler`,
  # stop it with `docker compose stop crawler` (it saves the batch it's on before exiting)
  crawler:
    build: .
    profiles: ["crawler"]
    command: ["python3", "src/crawl_players.py"]
    restart: unless-stopped
    # In-flight requests can take up to 30s to finish before it saves and exits
    stop_grace_period: 1m

    env_file:
      - .env

    environment:
      - LOG_FILE=/app/data/crawler.log

    volumes:
      - ./data:/app/data
      - ./src:/app/src/

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:8191:8191
    environment:
      - LOG_LEVEL=info
      - PROXY_URL=${PROXY_URL}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    depends_on:
      - spotify-tokener
    environment:
      - _JAVA_OPTIONS=-Xmx1G
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - REFRESH_TOKEN=${REFRESH_TOKEN}
      - SPOTIFY_API_KEY=${SPOTIFY_API_KEY}
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    ports:
      - 127.0.0.1:2333:2333

  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    container_name: spotify-tokener
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
