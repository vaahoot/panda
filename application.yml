server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD}
    bufferDurationMs: 1000

    sources:
      youtube: false
      bandcamp: false
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

  # Plugins aren't downloaded, docker-compose.yml mounts the jars in plugins/
  # (youtube-source 2be8e54 and lavasrc 4.8.3). maven.lavalink.dev serves directory pages instead of jars

plugins:
  youtube:
    enabled: true
    allowSearch: true # Whether "ytsearch:" and "ytmsearch:" can be used.
    allowDirectVideoIds: true # Whether just video IDs can match. If false, only complete URLs will be loaded.
    allowDirectPlaylistIds: true # Whether just playlist IDs can match. If false, only complete URLs will be loaded.
    # The clients to use for track loading. See below for a list of valid clients.
    # Clients are queried in the order they are given (so the first client is queried first and so on...)

    remoteCipher:
      url: "https://cipher.kikkia.dev"

    oauth:
      enabled: true
      refreshToken: ${REFRESH_TOKEN}

    clients:
      - MUSIC
      - TVHTML5_SIMPLY
      - TV
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR

  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      youtube: false

    spotify:
      clientId: "d4b4f7113d2449fbbc59911e44072e49"
      clientSecret: ${SPOTIFY_API_KEY}
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

      preferPartnerAPI: true  # Force to use spotify-token API instead of official Spotify API.
      customTokenEndpoint: "http://spotify-tokener:8080/api/token"

logging:
  level:
    root: INFO
    lavalink: INFO
